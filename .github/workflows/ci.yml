name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + extras + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,attr,fast]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: No em-dash and no emoji in tracked content (ADR-0067)
        run: python scripts/check_content_standards.py
  core-only:
    # proves the pure core imports and its tests pass WITHOUT the extras (the Pyodide posture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Tests (extras auto-skip)
        run: pytest -q
